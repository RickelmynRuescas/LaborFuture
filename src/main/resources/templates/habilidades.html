<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LaborFuture - Mapa de Habilidades</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--bg:#020817;--card:#0f172a;--accent:#22c55e;--text:#e5e7eb;--muted:#9ca3af;--radius:18px;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background: radial-gradient(circle at top, #111827, #020817);
  color: var(--text);
  padding: 24px 16px 32px; /* ou 40px na home, se você já estiver usando */
  min-height: 100vh;
}

        .container{max-width:1120px;margin:0 auto;}
        .top-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
        .logo{font-weight:600;font-size:16px;color:var(--accent);}
        .links{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;}
        .links a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:999px;border:1px solid transparent;}
        .links a:hover{border-color:rgba(148,163,253,.25);color:var(--text);}
        .links .btn{background:var(--accent);color:#020817;font-weight:600;border-color:transparent;}
        .user-label{font-size:11px;color:var(--accent);}
        h1{font-size:24px;margin-bottom:6px;}
        p{font-size:13px;color:var(--muted);}
        .grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
        .card{background:var(--card);border-radius:var(--radius);padding:12px 12px 10px;border:1px solid rgba(148,163,253,.1);box-shadow:0 8px 24px rgba(0,0,0,.5);}
        .card h3{font-size:15px;color:var(--accent);margin-bottom:4px;}
        .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid rgba(148,163,253,.25);
          font-size:9px;color:var(--muted);margin-top:3px;}
        .filter{margin-top:10px;margin-bottom:8px;}
        .filter input{width:100%;padding:7px 10px;border-radius:10px;border:1px solid rgba(148,163,253,.25);
          background:#020817;color:var(--text);font-size:11px;outline:none;}
        .filter input:focus{border-color:var(--accent);}
    </style>
</head>
<body>
<div class="container">

    <div class="top-nav">
        <div class="logo">LaborFuture</div>
        <div class="links">
            <a th:href="@{/home}">Início</a>
            <a th:href="@{/profissoes}">Profissões</a>
            <a th:href="@{/habilidades}">Habilidades</a>
            <a th:href="@{/impacto-ia}">Impacto da IA</a>
            <a th:href="@{/trilhas}">Trilhas</a>
            <a th:href="@{/sobre}">Sobre</a>
            <a th:if="${nomeUsuario != null and #strings.equalsIgnoreCase(nomeUsuario, 'admin')}"
               th:href="@{/admin/usuarios}">Admin</a>
            <span th:if="${nomeUsuario != null}" class="user-label">
        Olá, <span th:text="${nomeUsuario}"></span>
      </span>
            <a th:if="${nomeUsuario == null}" th:href="@{/cadastro}" class="btn">Entrar</a>
            <a th:if="${nomeUsuario != null}" th:href="@{/logout}" class="btn">Sair</a>
        </div>
    </div>

    <h1>Mapa de habilidades do futuro</h1>
    <p>Veja quais habilidades aparecem nas profissões em alta até 2050 e como elas se conectam ao trabalho braçal e digital.</p>

    <div class="filter">
        <input type="text" id="filtroHab" placeholder="Filtrar por habilidade ou profissão relacionada..." oninput="filtrar()">
    </div>

    <div class="grid" id="habLista">
        <div class="card" th:each="h : ${habilidades}"
             th:attr="data-texto=${h.nome} + ' ' + ${h.descricao} + ' ' + ${h.aplicacoes}">
            <h3 th:text="${h.nome}"></h3>
            <p th:text="${h.descricao}"></p>
            <div class="pill">
                Aplicações em: <span th:text="${h.aplicacoes}"></span>
            </div>
        </div>
    </div>
</div>

<script>
    function filtrar(){
      const termo = (document.getElementById('filtroHab').value || '').toLowerCase();
      document.querySelectorAll('#habLista .card').forEach(c=>{
        const txt = (c.getAttribute('data-texto') || '').toLowerCase();
        c.style.display = txt.includes(termo) ? 'block' : 'none';
      });
    }
</script>
</body>
</html>
