<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LaborFuture - Admin Usuários</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--bg:#020817;--card:#0f172a;--accent:#22c55e;--text:#e5e7eb;--muted:#9ca3af;--radius:18px;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background: radial-gradient(circle at top, #111827, #020817);
  color: var(--text);
  padding: 24px 16px 32px; /* ou 40px na home, se você já estiver usando */
  min-height: 100vh;
}

        .container{max-width:900px;margin:0 auto;}
        .top-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
        .logo{font-weight:600;font-size:16px;color:var(--accent);}
        .links{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;}
        .links a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:999px;border:1px solid transparent;}
        .links a:hover{border-color:rgba(148,163,253,.25);color:var(--text);}
        .links .btn{background:var(--accent);color:#020817;font-weight:600;border-color:transparent;}
        .user-label{font-size:11px;color:var(--accent);}
        h1{font-size:22px;margin-bottom:10px;}
        table{width:100%;font-size:12px;color:var(--muted);border-collapse:collapse;}
        th,td{padding:6px 8px;border-bottom:1px solid rgba(148,163,253,.12);}
        th{color:var(--accent);font-weight:500;}
        form{display:inline;}
        button{border:none;padding:2px 8px;border-radius:8px;font-size:10px;background:#ef4444;color:#fff;cursor:pointer;}
        button:hover{opacity:.9;}
        .hint{font-size:10px;color:var(--muted);margin-bottom:6px;}
    </style>
</head>
<body>
<div class="container">

    <div class="top-nav">
        <div class="logo">LaborFuture</div>
        <div class="links">
            <a th:href="@{/home}">Início</a>
            <a th:href="@{/profissoes}">Profissões</a>
            <a th:href="@{/habilidades}">Habilidades</a>
            <a th:href="@{/impacto-ia}">Impacto da IA</a>
            <a th:href="@{/trilhas}">Trilhas</a>
            <a th:href="@{/sobre}">Sobre</a>
            <a th:if="${nomeUsuario != null and #strings.equalsIgnoreCase(nomeUsuario, 'admin')}"
               th:href="@{/admin/usuarios}">Admin</a>
            <span th:if="${nomeUsuario != null}" class="user-label">
        Olá, <span th:text="${nomeUsuario}"></span>
      </span>
            <a th:if="${nomeUsuario != null}" th:href="@{/logout}" class="btn">Sair</a>
        </div>
    </div>

    <h1>Admin - Usuários cadastrados</h1>
    <p class="hint">Apenas o usuário <strong>admin</strong> pode acessar esta área. Use com responsabilidade durante os testes.</p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nome}"></td>
            <td>
                <form th:action="@{|/admin/usuarios/${u.id}/delete|}" method="post"
                      onsubmit="return confirm('Remover este usuário?');">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
