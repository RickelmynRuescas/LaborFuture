<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LaborFuture - Criar conta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:#020817;--card:#0f172a;--accent:#22c55e;
            --text:#e5e7eb;--muted:#9ca3af;--radius:18px;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background: radial-gradient(circle at top, #111827, #020817);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

        .card-box{
            width:100%;max-width:420px;
            background:var(--card);
            border-radius:var(--radius);
            padding:20px 20px 16px;
            box-shadow:0 16px 40px rgba(0,0,0,0.6);
            border:1px solid rgba(148,163,253,0.14);
        }
        .badge{
            display:inline-block;padding:4px 10px;
            border-radius:999px;border:1px solid var(--accent);
            font-size:10px;color:var(--accent);
            margin-bottom:6px;
        }
        h1{font-size:20px;margin-bottom:4px;}
        p{font-size:11px;color:var(--muted);margin-bottom:10px;}
        label{
            font-size:11px;color:var(--text);
            display:block;margin-bottom:3px;
        }
        input{
            width:100%;padding:7px 9px;
            border-radius:9px;border:1px solid #111827;
            background:#020817;color:var(--text);
            font-size:11px;margin-bottom:8px;outline:none;
        }
        input:focus{border-color:var(--accent);}
        .error,.msg-erro{
            font-size:9px;color:#f97316;
            margin-top:-4px;margin-bottom:6px;
        }
        button{
            width:100%;margin-top:2px;
            padding:8px 10px;border-radius:999px;
            border:none;background:var(--accent);
            color:#020817;font-weight:600;
            font-size:11px;cursor:pointer;
        }
        button:hover{opacity:.95;}
        .link-voltar{
            display:block;margin-top:10px;
            font-size:10px;color:var(--muted);
            text-align:center;text-decoration:none;
        }
        .link-voltar span{color:var(--accent);}
        .link-voltar:hover{color:var(--accent);}
    </style>
</head>
<body>
<div class="card-box">
    <div class="badge">LaborFuture • Criar conta</div>
    <h1>Crie sua conta</h1>
    <p>
        Escolha um nome de usuário e uma senha. Após criar, você será redirecionado
        para a tela inicial para entrar com seus dados.
    </p>

    <div th:if="${erroCadastro}" class="msg-erro" th:text="${erroCadastro}"></div>

    <form th:action="@{/registrar}" th:object="${novoUsuario}" method="post">
        <label for="nomeCadastro">Nome</label>
        <input type="text" id="nomeCadastro" th:field="*{nome}" placeholder="Nome de usuário único">
        <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

        <label for="senhaCadastro">Senha</label>
        <input type="password" id="senhaCadastro" th:field="*{senha}" placeholder="Crie uma senha segura">
        <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>

        <button type="submit">Criar conta</button>
    </form>

    <a th:href="@{/cadastro}" class="link-voltar">
        Já tem conta? <span>Voltar para entrar</span>
    </a>
</div>
</body>
</html>
