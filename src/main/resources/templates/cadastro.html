<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LaborFuture - Entrar com minha conta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg:#020817; --card:#0f172a; --accent:#22c55e; --text:#e5e7eb; --muted:#9ca3af; --radius:18px; }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background: radial-gradient(circle at top, #111827, #020817);
            color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;}
        .card-box{width:100%;max-width:420px; background:var(--card); border-radius:var(--radius); padding:20px 20px 16px;
            box-shadow:0 16px 40px rgba(0,0,0,0.6); border:1px solid rgba(148,163,253,0.14);}
        .badge{display:inline-block;padding:4px 10px; border-radius:999px; border:1px solid var(--accent);
            font-size:10px; color:var(--accent); margin-bottom:6px;}
        h1{font-size:20px;margin-bottom:4px;}
        p{font-size:11px;color:var(--muted);margin-bottom:10px;}
        label{font-size:11px;color:var(--text); display:block; margin-bottom:3px;}
        input{width:100%;padding:7px 9px; border-radius:9px; border:1px solid #111827; background:#020817; color:var(--text);
            font-size:11px; margin-bottom:8px; outline:none;}
        input:focus{border-color:var(--accent);}
        .error, .msg-erro{font-size:9px;color:#f97316; margin-top:-4px; margin-bottom:6px;}
        .msg-sucesso{font-size:10px;color:#22c55e; margin-bottom:8px;}
        button{width:100%; margin-top:2px; padding:8px 10px; border-radius:999px; border:none; background:var(--accent);
            color:#020817; font-weight:600; font-size:11px; cursor:pointer;}
        button:hover{opacity:.95;}
        .link-criar, .link-esqueci{display:block; margin-top:10px; font-size:10px; color:var(--muted); text-align:center; text-decoration:none;}
        .link-criar span, .link-esqueci span{color:var(--accent);}
        .link-criar:hover, .link-esqueci:hover{color:var(--accent);}
    </style>
</head>
<body>
<div class="card-box">
    <div class="badge">LaborFuture • Acesso</div>
    <h1>Entrar com minha conta</h1>
    <p>Use o nome de usuário e senha cadastrados para acessar os conteúdos sobre o futuro do trabalho.</p>

    <div th:if="${sucessoCadastro}" class="msg-sucesso" th:text="${sucessoCadastro}"></div>
<div th:if="${erroLogin}" class="msg-erro" th:text="${erroLogin}"></div>
<div th:if="${msgSucesso}" class="msg-sucesso" th:text="${msgSucesso}"></div>




    <form th:action="@{/login}" th:object="${login}" method="post">
        <label for="nomeLogin">Nome</label>
        <input type="text" id="nomeLogin" th:field="*{nome}" placeholder="Seu nome cadastrado">
        <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

        <label for="senhaLogin">Senha</label>
        <input type="password" id="senhaLogin" th:field="*{senha}" placeholder="Sua senha">
        <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>

        <button type="submit">Entrar no LaborFuture</button>
    </form>

    <a th:href="@{/criar-conta}" class="link-criar">Ainda não tem conta? <span>Crie sua conta</span></a>
    <a th:href="@{/esqueci-senha}" class="link-esqueci">Esqueci minha senha</a>
</div>
</body>
</html>
